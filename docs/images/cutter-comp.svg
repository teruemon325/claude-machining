<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="440" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">工具径補正 G41 / G42 と工具長補正 G43</text>
  <g transform="translate(40,60)">
    <text x="200" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">工具径補正（上面図）</text>
    <rect x="80" y="80" width="240" height="160" fill="#f7d9c4" stroke="#1f3a5f" stroke-width="2"/>
    <text x="200" y="165" text-anchor="middle" fill="#7a3d10" font-weight="bold">ワーク（輪郭をプログラム）</text>
    <!-- offset path -->
    <rect x="50" y="50" width="300" height="220" fill="none" stroke="#4a7ab8" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="200" y="40" text-anchor="middle" fill="#4a7ab8" font-size="12">工具中心の実経路（D 分だけ外側）</text>
    <!-- tool -->
    <circle cx="50" cy="160" r="30" fill="#8fa8c4" fill-opacity="0.8" stroke="#1f3a5f" stroke-width="2"/>
    <circle cx="50" cy="160" r="3" fill="#1f3a5f"/>
    <line x1="50" y1="160" x2="80" y2="160" stroke="#d64545" stroke-width="2"/>
    <text x="0" y="222" fill="#d64545" font-size="12">D 番号の補正量 = 半径</text>
    <!-- feed direction arrow -->
    <line x1="50" y1="130" x2="50" y2="90" stroke="#e8833a" stroke-width="3"/>
    <polygon points="44,90 50,76 56,90" fill="#e8833a"/>
    <text x="60" y="100" fill="#e8833a" font-size="12">進行方向</text>
    <text x="0" y="300" fill="#333" font-size="12">G41：進行方向に向かって工具がワークの左側（外形をダウンカット・時計回り）</text>
    <text x="0" y="320" fill="#333" font-size="12">G42：進行方向に向かって工具がワークの右側</text>
    <text x="0" y="340" fill="#333" font-size="12">G40：補正キャンセル（直線移動中にワークから離れて解除）</text>
    <text x="0" y="360" fill="#3a9a5b" font-size="12">利点：仕上げ寸法の追い込みを D 値の変更だけで行える（例 +0.02）</text>
  </g>
  <g transform="translate(500,60)">
    <text x="190" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">工具長補正 G43 H（側面図）</text>
    <rect x="60" y="20" width="60" height="30" fill="#4a7ab8" stroke="#1f3a5f"/>
    <text x="90" y="40" text-anchor="middle" fill="#fff" font-size="11">主軸端</text>
    <rect x="80" y="50" width="20" height="120" fill="#8fa8c4" stroke="#1f3a5f"/>
    <rect x="220" y="20" width="60" height="30" fill="#4a7ab8" stroke="#1f3a5f"/>
    <text x="250" y="40" text-anchor="middle" fill="#fff" font-size="11">主軸端</text>
    <rect x="240" y="50" width="20" height="70" fill="#8fa8c4" stroke="#1f3a5f"/>
    <rect x="0" y="200" width="380" height="40" fill="#f7d9c4" stroke="#1f3a5f" stroke-width="2"/>
    <text x="190" y="225" text-anchor="middle" fill="#7a3d10">ワーク上面 Z0</text>
    <g stroke="#3a9a5b" stroke-width="2">
      <line x1="140" y1="50" x2="140" y2="170"/><line x1="134" y1="50" x2="146" y2="50"/><line x1="134" y1="170" x2="146" y2="170"/>
      <line x1="300" y1="50" x2="300" y2="120"/><line x1="294" y1="50" x2="306" y2="50"/><line x1="294" y1="120" x2="306" y2="120"/>
    </g>
    <text x="150" y="115" fill="#3a9a5b" font-size="12">H01 = 120.000</text>
    <text x="310" y="90" fill="#3a9a5b" font-size="12">H02 = 70.000</text>
    <text x="0" y="270" fill="#333" font-size="12">工具ごとに長さが違う → H 番号に長さを登録し</text>
    <text x="0" y="288" fill="#333" font-size="12">G43 Z__ H__ で呼び出す。プリセッタ／機上測定で自動化。</text>
    <text x="0" y="316" fill="#d64545" font-size="12">事故の定番：H 番号の間違い、G43 なしで Z 移動、</text>
    <text x="0" y="334" fill="#d64545" font-size="12">別機械で測った H 値の流用、G49 忘れ。</text>
    <text x="0" y="360" fill="#3a9a5b" font-size="12">対策：工具番号＝H 番号＝D 番号で統一、初品は Z+50 で空運転</text>
  </g>
  <text x="450" y="455" text-anchor="middle" fill="#555" font-size="12">補正の立ち上げ／解除はワークから離れた場所で、直線ブロックで行う（円弧ブロックでの立ち上げはアラーム）。</text>
</svg>
