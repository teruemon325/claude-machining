<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">切削条件の基本要素（エンドミル加工）</text>
  <!-- side view -->
  <g transform="translate(60,60)">
    <text x="150" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">側面図</text>
    <!-- workpiece -->
    <rect x="0" y="180" width="300" height="90" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="0" y="150" width="140" height="30" fill="#f7d9c4" stroke="#1f3a5f" stroke-width="1.5"/>
    <text x="70" y="169" text-anchor="middle" font-size="11" fill="#7a3d10">除去される部分</text>
    <!-- tool -->
    <rect x="140" y="20" width="60" height="180" fill="#8fa8c4" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="150" y="0" width="40" height="20" fill="#4a7ab8" stroke="#1f3a5f"/>
    <text x="170" y="115" text-anchor="middle" fill="#fff" font-weight="bold" transform="rotate(-90 170 115)">エンドミル</text>
    <!-- rotation -->
    <path d="M120 10 a 55 20 0 0 1 100 0" fill="none" stroke="#d64545" stroke-width="2"/>
    <polygon points="220,10 212,2 210,14" fill="#d64545"/>
    <text x="235" y="14" fill="#d64545" font-weight="bold">n [min⁻¹]</text>
    <!-- ap -->
    <line x1="320" y1="150" x2="320" y2="180" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="312" y1="150" x2="328" y2="150" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="312" y1="180" x2="328" y2="180" stroke="#3a9a5b" stroke-width="2"/>
    <text x="334" y="170" fill="#3a9a5b" font-weight="bold">ap 軸方向切込み</text>
    <!-- feed -->
    <line x1="60" y1="100" x2="120" y2="100" stroke="#e8833a" stroke-width="3"/>
    <polygon points="60,94 46,100 60,106" fill="#e8833a"/>
    <text x="0" y="90" fill="#e8833a" font-weight="bold">Vf 送り速度</text>
    <text x="0" y="106" fill="#e8833a" font-size="11">[mm/min]</text>
    <!-- Vc -->
    <text x="230" y="60" fill="#4a7ab8" font-weight="bold">Vc 切削速度</text>
    <text x="230" y="76" fill="#4a7ab8" font-size="11">[m/min]＝外周の周速</text>
  </g>
  <!-- top view -->
  <g transform="translate(520,60)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">上面図</text>
    <rect x="0" y="60" width="320" height="200" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="0" y="60" width="320" height="60" fill="#f7d9c4" stroke="#1f3a5f" stroke-width="1"/>
    <circle cx="130" cy="120" r="60" fill="#8fa8c4" fill-opacity="0.85" stroke="#1f3a5f" stroke-width="2"/>
    <circle cx="130" cy="120" r="3" fill="#1f3a5f"/>
    <path d="M90 90 a 50 50 0 0 1 80 0" fill="none" stroke="#d64545" stroke-width="2"/>
    <polygon points="170,90 160,82 158,95" fill="#d64545"/>
    <!-- ae -->
    <line x1="-18" y1="60" x2="-18" y2="120" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="-26" y1="60" x2="-10" y2="60" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="-26" y1="120" x2="-10" y2="120" stroke="#3a9a5b" stroke-width="2"/>
    <text x="-30" y="86" text-anchor="end" fill="#3a9a5b" font-weight="bold" font-size="12">ae</text>
    <text x="-30" y="102" text-anchor="end" fill="#3a9a5b" font-size="11">径方向切込み</text>
    <!-- D -->
    <line x1="70" y1="200" x2="190" y2="200" stroke="#4a7ab8" stroke-width="2"/>
    <line x1="70" y1="192" x2="70" y2="208" stroke="#4a7ab8" stroke-width="2"/>
    <line x1="190" y1="192" x2="190" y2="208" stroke="#4a7ab8" stroke-width="2"/>
    <text x="130" y="222" text-anchor="middle" fill="#4a7ab8" font-weight="bold">D 工具径 [mm]</text>
    <!-- feed arrow -->
    <line x1="200" y1="150" x2="260" y2="150" stroke="#e8833a" stroke-width="3"/>
    <polygon points="260,144 274,150 260,156" fill="#e8833a"/>
    <text x="230" y="172" text-anchor="middle" fill="#e8833a" font-size="11">送り方向</text>
    <!-- fz -->
    <text x="0" y="290" fill="#1f3a5f" font-size="12">fz：1 刃あたりの送り [mm/刃]　z：刃数</text>
  </g>
  <!-- formulas -->
  <rect x="60" y="360" width="780" height="95" rx="6" fill="#f7f9fc" stroke="#4a7ab8" stroke-width="1.5"/>
  <text x="80" y="385" font-weight="bold" fill="#1f3a5f">基本式</text>
  <text x="80" y="410" fill="#222">回転数　n = 1000 × Vc ÷ (π × D)</text>
  <text x="80" y="435" fill="#222">送り速度　Vf = fz × z × n</text>
  <text x="470" y="410" fill="#222">切りくず除去量　Q = ap × ae × Vf ÷ 1000 [cm³/min]</text>
  <text x="470" y="435" fill="#222">例：Vc=150, D=10 → n≈4,775 min⁻¹、fz=0.05, z=4 → Vf≈955 mm/min</text>
</svg>
