<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">マシニングセンタの保守点検サイクル</text>
  <g font-size="12">
    <g transform="translate(30,60)">
      <rect x="0" y="0" width="200" height="380" rx="8" fill="#e3f0e7" stroke="#3a9a5b" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" font-weight="bold" font-size="15" fill="#1d5a33">毎日（始業・終業）</text>
      <text x="12" y="56" fill="#333">□ 潤滑油・作動油の油量</text>
      <text x="12" y="78" fill="#333">□ エア圧力（0.5MPa 前後）</text>
      <text x="12" y="100" fill="#333">□ クーラント量・濃度・臭い</text>
      <text x="12" y="122" fill="#333">□ 暖機運転（10〜30 分）</text>
      <text x="12" y="144" fill="#333">□ 主軸テーパ・ホルダ清掃</text>
      <text x="12" y="166" fill="#333">□ 異音・振動・アラーム履歴</text>
      <text x="12" y="188" fill="#333">□ テーブル・T 溝の切りくず</text>
      <text x="12" y="210" fill="#333">□ ドア・安全装置の動作</text>
      <text x="12" y="232" fill="#333">□ 終業：切りくず除去・</text>
      <text x="12" y="250" fill="#333">　 摺動面のクーラント拭き取り</text>
      <text x="12" y="290" fill="#1d5a33" font-weight="bold">ポイント</text>
      <text x="12" y="310" fill="#333">主軸テーパの切りくず 1 粒で</text>
      <text x="12" y="328" fill="#333">振れが数十 µm 出る。</text>
      <text x="12" y="346" fill="#333">ホルダを挿す前に必ず拭く。</text>
    </g>
    <g transform="translate(250,60)">
      <rect x="0" y="0" width="200" height="380" rx="8" fill="#e6ecf5" stroke="#4a7ab8" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" font-weight="bold" font-size="15" fill="#1f3a5f">毎週〜毎月</text>
      <text x="12" y="56" fill="#333">□ クーラントの pH・濃度計測</text>
      <text x="12" y="78" fill="#333">□ 浮上油の除去（腐敗防止）</text>
      <text x="12" y="100" fill="#333">□ フィルタ・ストレーナ清掃</text>
      <text x="12" y="122" fill="#333">□ 電装盤フィルタ・ファン</text>
      <text x="12" y="144" fill="#333">□ ATC マガジン・アームの清掃</text>
      <text x="12" y="166" fill="#333">□ テレスコカバー・ワイパ</text>
      <text x="12" y="188" fill="#333">□ 主軸振れ（テストバー）確認</text>
      <text x="12" y="210" fill="#333">□ バックアップ（パラメータ・</text>
      <text x="12" y="228" fill="#333">　 オフセット・プログラム）</text>
      <text x="12" y="250" fill="#333">□ 油圧ユニット・チラーの点検</text>
      <text x="12" y="290" fill="#1f3a5f" font-weight="bold">ポイント</text>
      <text x="12" y="310" fill="#333">パラメータのバックアップは</text>
      <text x="12" y="328" fill="#333">月 1 回＋変更のたびに。</text>
      <text x="12" y="346" fill="#333">電池切れで全消失の事例多数。</text>
    </g>
    <g transform="translate(470,60)">
      <rect x="0" y="0" width="200" height="380" rx="8" fill="#fdf1dc" stroke="#e8a83a" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" font-weight="bold" font-size="15" fill="#7a5010">半年〜1 年</text>
      <text x="12" y="56" fill="#333">□ 幾何精度検査</text>
      <text x="12" y="74" fill="#333">　（真直度・直角度・主軸振れ）</text>
      <text x="12" y="96" fill="#333">□ 位置決め精度・バックラッシュ</text>
      <text x="12" y="114" fill="#333">　 補正（レーザ／ダイヤル）</text>
      <text x="12" y="136" fill="#333">□ 主軸・ボールねじ潤滑グリス</text>
      <text x="12" y="158" fill="#333">□ 作動油・潤滑油の全交換</text>
      <text x="12" y="180" fill="#333">□ クーラント全交換・タンク清掃</text>
      <text x="12" y="202" fill="#333">□ NC・PLC のバッテリ交換</text>
      <text x="12" y="224" fill="#333">□ レベル（水平）出しの確認</text>
      <text x="12" y="246" fill="#333">□ ボールバー測定（円弧精度）</text>
      <text x="12" y="290" fill="#7a5010" font-weight="bold">ポイント</text>
      <text x="12" y="310" fill="#333">水平が狂うと真直度・直角度が</text>
      <text x="12" y="328" fill="#333">崩れる。据付後 1 年は年 2 回。</text>
    </g>
    <g transform="translate(690,60)">
      <rect x="0" y="0" width="190" height="380" rx="8" fill="#fbe3e3" stroke="#d64545" stroke-width="1.5"/>
      <text x="95" y="26" text-anchor="middle" font-weight="bold" font-size="15" fill="#8a1f1f">異常時の兆候</text>
      <text x="12" y="56" fill="#333">・面に周期的な模様</text>
      <text x="12" y="74" fill="#333">　→ 主軸ベアリング／振れ</text>
      <text x="12" y="98" fill="#333">・円弧に段差（象限突起）</text>
      <text x="12" y="116" fill="#333">　→ バックラッシュ・サーボ</text>
      <text x="12" y="140" fill="#333">・寸法が徐々にずれる</text>
      <text x="12" y="158" fill="#333">　→ 熱変位・ボールねじ摩耗</text>
      <text x="12" y="182" fill="#333">・工具交換でガタつく</text>
      <text x="12" y="200" fill="#333">　→ ATC 調整・クランプ力低下</text>
      <text x="12" y="224" fill="#333">・主軸から異音・発熱</text>
      <text x="12" y="242" fill="#333">　→ 即停止、ベアリング点検</text>
      <text x="12" y="266" fill="#333">・エア抜け・油漏れ</text>
      <text x="12" y="284" fill="#333">　→ ホース・シール交換</text>
      <text x="12" y="320" fill="#8a1f1f" font-weight="bold">記録が命</text>
      <text x="12" y="340" fill="#333">点検表・精度測定値を</text>
      <text x="12" y="358" fill="#333">時系列で残し傾向を見る</text>
    </g>
  </g>
  <text x="450" y="460" text-anchor="middle" fill="#555" font-size="12">「壊れてから直す」より「精度が落ち始めたら手を打つ」。測定値の推移グラフを機械ごとに持つ。</text>
</svg>
