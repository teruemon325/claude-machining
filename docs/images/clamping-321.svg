<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="480" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">位置決めの 3-2-1 原則とクランプの基本</text>
  <g transform="translate(60,70)">
    <!-- isometric block -->
    <polygon points="60,120 260,120 320,80 120,80" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <polygon points="60,120 260,120 260,220 60,220" fill="#dbe4ee" stroke="#1f3a5f" stroke-width="2"/>
    <polygon points="260,120 320,80 320,180 260,220" fill="#c9d3de" stroke="#1f3a5f" stroke-width="2"/>
    <!-- 3 points bottom -->
    <g fill="#d64545">
      <circle cx="100" cy="235" r="7"/><circle cx="230" cy="235" r="7"/><circle cx="295" cy="195" r="7"/>
    </g>
    <text x="100" y="262" text-anchor="middle" fill="#d64545" font-weight="bold">3 点</text>
    <text x="230" y="262" text-anchor="middle" fill="#d64545" font-size="12">底面：Z・傾き 2 方向を拘束</text>
    <!-- 2 points side -->
    <g fill="#3a9a5b">
      <circle cx="45" cy="150" r="7"/><circle cx="45" cy="200" r="7"/>
    </g>
    <text x="20" y="130" fill="#3a9a5b" font-weight="bold">2 点</text>
    <text x="-35" y="175" fill="#3a9a5b" font-size="12">側面：Y と</text>
    <text x="-35" y="191" fill="#3a9a5b" font-size="12">回転を拘束</text>
    <!-- 1 point end -->
    <circle cx="340" cy="140" r="7" fill="#4a7ab8"/>
    <text x="352" y="145" fill="#4a7ab8" font-weight="bold">1 点</text>
    <text x="352" y="163" fill="#4a7ab8" font-size="12">端面：X を拘束</text>
    <!-- clamp force -->
    <line x1="160" y1="30" x2="160" y2="75" stroke="#e8833a" stroke-width="4"/>
    <polygon points="152,75 160,90 168,75" fill="#e8833a"/>
    <text x="160" y="22" text-anchor="middle" fill="#e8833a" font-weight="bold">クランプ力は位置決め面に向けて</text>
    <text x="60" y="300" fill="#333" font-size="12">6 自由度（X, Y, Z 移動＋3 回転）を 3+2+1 の 6 点で過不足なく拘束する。</text>
    <text x="60" y="320" fill="#333" font-size="12">基準面（データム）と位置決め点を一致させると寸法が安定する。</text>
  </g>
  <!-- good / bad clamp -->
  <g transform="translate(520,70)">
    <text x="170" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">クランプ位置の良い例・悪い例</text>
    <!-- good -->
    <rect x="0" y="40" width="160" height="16" fill="#c9d3de" stroke="#1f3a5f"/>
    <rect x="30" y="56" width="100" height="18" fill="#b9c8d8" stroke="#1f3a5f"/>
    <rect x="0" y="74" width="160" height="12" fill="#c9d3de" stroke="#1f3a5f"/>
    <rect x="20" y="20" width="120" height="20" fill="#e8833a" stroke="#1f3a5f"/>
    <line x1="40" y1="0" x2="40" y2="20" stroke="#3a9a5b" stroke-width="4"/>
    <line x1="120" y1="0" x2="120" y2="20" stroke="#3a9a5b" stroke-width="4"/>
    <text x="80" y="108" text-anchor="middle" fill="#3a9a5b" font-weight="bold">○ 支持点の真上を押す</text>
    <!-- bad -->
    <rect x="200" y="40" width="160" height="16" fill="#c9d3de" stroke="#1f3a5f"/>
    <rect x="230" y="56" width="100" height="18" fill="#b9c8d8" stroke="#1f3a5f"/>
    <rect x="200" y="74" width="160" height="12" fill="#c9d3de" stroke="#1f3a5f"/>
    <path d="M220 24 q 60 -14 120 0 l 0 16 q -60 -12 -120 0 z" fill="#e8833a" stroke="#1f3a5f"/>
    <line x1="280" y1="0" x2="280" y2="16" stroke="#d64545" stroke-width="4"/>
    <text x="280" y="108" text-anchor="middle" fill="#d64545" font-weight="bold">× 中空を押して変形</text>
    <!-- rules -->
    <rect x="0" y="130" width="360" height="190" rx="6" fill="#f7f9fc" stroke="#4a7ab8"/>
    <text x="12" y="152" fill="#1f3a5f" font-weight="bold">クランプの鉄則</text>
    <text x="12" y="176" fill="#333" font-size="12">1. 切削力の向きを考え、ワークが「逃げない」方向に固定</text>
    <text x="12" y="196" fill="#333" font-size="12">2. クランプは剛性の高い部分（厚肉・支持点直上）に</text>
    <text x="12" y="216" fill="#333" font-size="12">3. 締め過ぎない：薄物は締付で歪み、外すと戻って寸法 NG</text>
    <text x="12" y="236" fill="#333" font-size="12">4. 工具経路とクランプの干渉を CAM・空運転で確認</text>
    <text x="12" y="256" fill="#333" font-size="12">5. 荒加工後に一度クランプを緩めて締め直す（応力解放）</text>
    <text x="12" y="276" fill="#333" font-size="12">6. ボルトは適正トルク、ネジ山は 1D 以上かかる長さ</text>
    <text x="12" y="296" fill="#333" font-size="12">7. 切りくずやバリを噛まない（基準面は毎回清掃）</text>
    <text x="12" y="316" fill="#333" font-size="12">8. 段取り写真・治具図を残し、再現性を確保する</text>
  </g>
</svg>
