<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">突き出し長と工具のたわみ：L の 3 乗、D の 4 乗で効く</text>
  <g transform="translate(60,70)">
    <!-- short -->
    <rect x="0" y="0" width="80" height="60" fill="#8fa8c4" stroke="#1f3a5f" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" fill="#fff" font-size="12">ホルダ</text>
    <rect x="80" y="20" width="120" height="20" fill="#555"/>
    <line x1="80" y1="80" x2="200" y2="80" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="80" y1="74" x2="80" y2="86" stroke="#3a9a5b"/><line x1="200" y1="74" x2="200" y2="86" stroke="#3a9a5b"/>
    <text x="140" y="100" text-anchor="middle" fill="#3a9a5b" font-weight="bold">L = 3D</text>
    <line x1="200" y1="30" x2="200" y2="60" stroke="#d64545" stroke-width="3"/>
    <polygon points="194,60 200,72 206,60" fill="#d64545"/>
    <text x="215" y="55" fill="#d64545" font-size="12">切削力 F</text>
    <text x="140" y="125" text-anchor="middle" fill="#333">たわみ δ ＝ 1（基準）</text>
    <!-- long -->
    <rect x="0" y="180" width="80" height="60" fill="#8fa8c4" stroke="#1f3a5f" stroke-width="2"/>
    <text x="40" y="215" text-anchor="middle" fill="#fff" font-size="12">ホルダ</text>
    <path d="M80 200 L 300 200 Q 320 200 320 215 L 320 225 Q 320 240 300 236 L 80 220 Z" fill="#555"/>
    <path d="M80 200 L320 200" stroke="#aaa" stroke-dasharray="4 3" fill="none"/>
    <line x1="80" y1="260" x2="320" y2="260" stroke="#d64545" stroke-width="2"/>
    <line x1="80" y1="254" x2="80" y2="266" stroke="#d64545"/><line x1="320" y1="254" x2="320" y2="266" stroke="#d64545"/>
    <text x="200" y="280" text-anchor="middle" fill="#d64545" font-weight="bold">L = 6D（2 倍）</text>
    <line x1="320" y1="225" x2="320" y2="255" stroke="#d64545" stroke-width="3" opacity="0"/>
    <text x="200" y="305" text-anchor="middle" fill="#333">たわみ δ ＝ 2³ ＝ 8 倍</text>
  </g>
  <g transform="translate(480,70)">
    <rect x="0" y="0" width="380" height="240" rx="6" fill="#f7f9fc" stroke="#4a7ab8"/>
    <text x="12" y="24" fill="#1f3a5f" font-weight="bold">片持ち梁のたわみ</text>
    <text x="12" y="52" fill="#222" font-size="15">δ = F × L³ ÷ (3 × E × I)、 I ∝ D⁴</text>
    <text x="12" y="80" fill="#333" font-size="12">・突き出し 2 倍 → たわみ 8 倍（びびり・寸法不良・欠損）</text>
    <text x="12" y="100" fill="#333" font-size="12">・径を 20% 落とす → たわみ約 2.4 倍</text>
    <text x="12" y="120" fill="#333" font-size="12">・超硬（E≈600GPa）はハイス（E≈210GPa）の約 3 倍剛性</text>
    <text x="12" y="150" fill="#1f3a5f" font-weight="bold">現場ルール</text>
    <text x="12" y="172" fill="#333" font-size="12">1. 突き出しは「必要最小＋2〜3mm」にする</text>
    <text x="12" y="190" fill="#333" font-size="12">2. 深い加工は段階的に短い工具→長い工具で</text>
    <text x="12" y="208" fill="#333" font-size="12">3. L/D &gt; 4 なら ae を減らし、ネック付きや超硬シャンクを使う</text>
    <text x="12" y="226" fill="#333" font-size="12">4. 側面仕上げは工具のたわみで「上が太く下が細く」なる → 補正</text>
  </g>
  <text x="450" y="400" text-anchor="middle" fill="#555" font-size="12">たわみは寸法だけでなく、びびり（剛性低下）と工具寿命（刃先への衝撃）にも直結する。</text>
  <text x="450" y="422" text-anchor="middle" fill="#555" font-size="12">深い側面仕上げでテーパになるときは、仕上げ代を 0.1 以下にして「ゼロカット（同じ経路を 2 回）」が有効。</text>
</svg>
