<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="400" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">切りくず薄化（チップシニング）：ae が小さいと実際の切りくず厚さは薄くなる</text>
  <g transform="translate(60,60)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">ae = 50% D 以上</text>
    <rect x="0" y="60" width="320" height="180" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="0" y="60" width="320" height="90" fill="#f7d9c4"/>
    <circle cx="160" cy="150" r="90" fill="#8fa8c4" fill-opacity="0.85" stroke="#1f3a5f" stroke-width="2"/>
    <path d="M160 60 A90 90 0 0 1 250 150" fill="none" stroke="#d64545" stroke-width="4"/>
    <line x1="160" y1="60" x2="160" y2="150" stroke="#1f3a5f" stroke-dasharray="3 3"/>
    <text x="260" y="70" fill="#d64545" font-size="12">最大厚さ = fz</text>
    <text x="0" y="270" fill="#333" font-size="12">切りくず厚さは設定した fz どおり</text>
  </g>
  <g transform="translate(480,60)">
    <text x="160" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">ae = 10% D（側面仕上げ・トロコイド）</text>
    <rect x="0" y="60" width="320" height="180" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <rect x="0" y="60" width="320" height="18" fill="#f7d9c4"/>
    <circle cx="160" cy="150" r="90" fill="#8fa8c4" fill-opacity="0.85" stroke="#1f3a5f" stroke-width="2"/>
    <path d="M160 60 A90 90 0 0 1 214 78" fill="none" stroke="#d64545" stroke-width="4"/>
    <text x="222" y="70" fill="#d64545" font-size="12">実厚さ ≈ 0.6 fz</text>
    <text x="0" y="270" fill="#333" font-size="12">刃が薄い部分しか削らない → 擦り・摩耗・びびりの原因</text>
    <text x="0" y="290" fill="#3a9a5b" font-size="12">対策：fz を補正して上げる（例 fz × 1.67）</text>
  </g>
  <rect x="60" y="340" width="780" height="45" rx="6" fill="#f7f9fc" stroke="#4a7ab8"/>
  <text x="80" y="368" fill="#222">補正式：fz' = fz ÷ √( 1 − (1 − 2·ae/D)² )　　例）ae/D = 0.1 → 係数 1.67、ae/D = 0.2 → 1.25、ae/D = 0.5 → 1.0</text>
</svg>
