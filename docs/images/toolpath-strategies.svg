<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="440" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">CAM の代表的な加工パス戦略</text>
  <g font-size="12">
    <g transform="translate(30,60)">
      <rect x="0" y="0" width="200" height="330" rx="8" fill="#f7f9fc" stroke="#4a7ab8"/>
      <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#1f3a5f">従来の輪郭オフセット</text>
      <rect x="30" y="50" width="140" height="110" fill="#eef3f8" stroke="#1f3a5f"/>
      <g fill="none" stroke="#4a7ab8" stroke-width="1.5">
        <rect x="42" y="62" width="116" height="86"/><rect x="54" y="74" width="92" height="62"/><rect x="66" y="86" width="68" height="38"/><rect x="78" y="98" width="44" height="14"/>
      </g>
      <text x="10" y="190" fill="#333">・ae 一定でなくコーナで急増</text>
      <text x="10" y="208" fill="#333">・コーナで負荷↑・びびり・欠損</text>
      <text x="10" y="226" fill="#333">・ap を大きく取れない</text>
      <text x="10" y="254" fill="#3a9a5b">向き：単純形状・浅いポケット</text>
      <text x="10" y="272" fill="#3a9a5b">条件：ae 50〜70%、ap 0.5〜1D</text>
    </g>
    <g transform="translate(250,60)">
      <rect x="0" y="0" width="200" height="330" rx="8" fill="#f7f9fc" stroke="#4a7ab8"/>
      <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#1f3a5f">トロコイド／高能率荒加工</text>
      <rect x="30" y="50" width="140" height="110" fill="#eef3f8" stroke="#1f3a5f"/>
      <path d="M40 105 a 15 15 0 1 1 20 0 a 15 15 0 1 1 20 0 a 15 15 0 1 1 20 0 a 15 15 0 1 1 20 0 a 15 15 0 1 1 20 0 a 15 15 0 1 1 20 0" fill="none" stroke="#e8833a" stroke-width="2"/>
      <text x="10" y="190" fill="#333">・ae 10〜20% で常に一定</text>
      <text x="10" y="208" fill="#333">・ap を刃長いっぱい（2〜3D）</text>
      <text x="10" y="226" fill="#333">・高 Vc・高送り、切りくず薄化</text>
      <text x="10" y="254" fill="#3a9a5b">向き：深いポケット・難削材</text>
      <text x="10" y="272" fill="#3a9a5b">条件：ae 10%、ap 2〜3D、fz 補正</text>
      <text x="10" y="300" fill="#7a5010">工具寿命 2〜5 倍、除去量↑</text>
      <text x="10" y="318" fill="#7a5010">小径工具で大きな除去が可能</text>
    </g>
    <g transform="translate(470,60)">
      <rect x="0" y="0" width="200" height="330" rx="8" fill="#f7f9fc" stroke="#4a7ab8"/>
      <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#1f3a5f">ヘリカル／ランプ進入</text>
      <rect x="30" y="50" width="140" height="110" fill="#eef3f8" stroke="#1f3a5f"/>
      <ellipse cx="100" cy="80" rx="40" ry="10" fill="none" stroke="#e8833a" stroke-width="2"/>
      <ellipse cx="100" cy="100" rx="40" ry="10" fill="none" stroke="#e8833a" stroke-width="2"/>
      <ellipse cx="100" cy="120" rx="40" ry="10" fill="none" stroke="#e8833a" stroke-width="2"/>
      <line x1="100" y1="60" x2="100" y2="140" stroke="#333" stroke-dasharray="3 3"/>
      <text x="10" y="190" fill="#333">・エンドミルで穴を掘りながら進入</text>
      <text x="10" y="208" fill="#333">・ランプ角 2〜5°（アルミは 10°）</text>
      <text x="10" y="226" fill="#333">・下穴不要、底刃の負担を軽減</text>
      <text x="10" y="254" fill="#3a9a5b">向き：閉じたポケットの進入</text>
      <text x="10" y="272" fill="#d64545">注意：ヘリカル径は D×1.2 以上</text>
      <text x="10" y="290" fill="#d64545">　（中心に削り残しが立つ工具あり）</text>
    </g>
    <g transform="translate(690,60)">
      <rect x="0" y="0" width="190" height="330" rx="8" fill="#f7f9fc" stroke="#4a7ab8"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold" fill="#1f3a5f">3D 仕上げ</text>
      <rect x="25" y="50" width="140" height="110" fill="#eef3f8" stroke="#1f3a5f"/>
      <path d="M35 150 q 60 -120 120 0" fill="none" stroke="#1f3a5f" stroke-width="2"/>
      <g stroke="#e8833a" stroke-width="1.2" fill="none">
        <path d="M35 150 q 60 -110 120 0"/><path d="M40 150 q 55 -100 110 0"/><path d="M45 150 q 50 -90 100 0"/>
      </g>
      <text x="10" y="190" fill="#333">等高線：急斜面（壁）向き</text>
      <text x="10" y="208" fill="#333">走査線：緩斜面（底面）向き</text>
      <text x="10" y="226" fill="#333">スキャロップ一定：全面均一</text>
      <text x="10" y="254" fill="#3a9a5b">ボール径・ピック ae で面粗さ決定</text>
      <text x="10" y="272" fill="#3a9a5b">傾斜 30〜60° は組み合わせ</text>
      <text x="10" y="300" fill="#7a5010">公差設定 0.005 以下、</text>
      <text x="10" y="318" fill="#7a5010">スムージング／高精度モード ON</text>
    </g>
  </g>
  <text x="450" y="420" text-anchor="middle" fill="#555" font-size="12">荒は「除去量／工具寿命」、仕上げは「面品位／寸法」で戦略を選ぶ。中仕上げで取り代を均一化すると仕上げが安定する。</text>
</svg>
