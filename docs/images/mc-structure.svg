<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="14">
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">立形マシニングセンタの基本構造</text>
  <!-- bed -->
  <rect x="120" y="420" width="480" height="50" fill="#c9d3de" stroke="#1f3a5f" stroke-width="2"/>
  <text x="360" y="450" text-anchor="middle" fill="#1f3a5f" font-weight="bold">ベッド</text>
  <!-- saddle / table -->
  <rect x="180" y="385" width="300" height="35" fill="#dbe4ee" stroke="#1f3a5f" stroke-width="2"/>
  <text x="330" y="408" text-anchor="middle" fill="#1f3a5f">サドル（Y 軸）</text>
  <rect x="150" y="350" width="360" height="35" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
  <text x="330" y="373" text-anchor="middle" fill="#1f3a5f" font-weight="bold">テーブル（X 軸）</text>
  <!-- T slots -->
  <g stroke="#1f3a5f" stroke-width="1.5" fill="none">
    <path d="M200 350 v10 h-8 v8 h24 v-8 h-8 v-10"/>
    <path d="M300 350 v10 h-8 v8 h24 v-8 h-8 v-10"/>
    <path d="M400 350 v10 h-8 v8 h24 v-8 h-8 v-10"/>
  </g>
  <!-- workpiece + vise -->
  <rect x="265" y="322" width="140" height="28" fill="#b9c8d8" stroke="#1f3a5f" stroke-width="2"/>
  <text x="335" y="341" text-anchor="middle" fill="#1f3a5f">バイス</text>
  <rect x="305" y="298" width="60" height="24" fill="#e8833a" stroke="#1f3a5f" stroke-width="2"/>
  <text x="335" y="315" text-anchor="middle" fill="#ffffff" font-size="12">ワーク</text>
  <!-- column -->
  <rect x="540" y="120" width="60" height="300" fill="#c9d3de" stroke="#1f3a5f" stroke-width="2"/>
  <text x="570" y="270" text-anchor="middle" fill="#1f3a5f" font-weight="bold" transform="rotate(-90 570 270)">コラム</text>
  <!-- spindle head -->
  <rect x="380" y="120" width="160" height="40" fill="#c9d3de" stroke="#1f3a5f" stroke-width="2"/>
  <text x="460" y="145" text-anchor="middle" fill="#1f3a5f" font-size="12">Z 軸スライド</text>
  <rect x="280" y="120" width="110" height="90" fill="#dbe4ee" stroke="#1f3a5f" stroke-width="2"/>
  <text x="335" y="160" text-anchor="middle" fill="#1f3a5f" font-weight="bold">主軸頭</text>
  <text x="335" y="180" text-anchor="middle" fill="#1f3a5f" font-size="12">（Z 軸）</text>
  <!-- spindle -->
  <rect x="315" y="210" width="40" height="40" fill="#8fa8c4" stroke="#1f3a5f" stroke-width="2"/>
  <text x="335" y="235" text-anchor="middle" fill="#fff" font-size="11">主軸</text>
  <!-- holder -->
  <polygon points="320,250 350,250 345,275 325,275" fill="#4a7ab8" stroke="#1f3a5f" stroke-width="1.5"/>
  <!-- tool -->
  <rect x="331" y="275" width="8" height="23" fill="#555"/>
  <line x1="335" y1="95" x2="335" y2="298" stroke="#d64545" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="343" y="108" fill="#d64545" font-size="12">主軸中心</text>
  <!-- ATC -->
  <circle cx="200" cy="140" r="55" fill="none" stroke="#1f3a5f" stroke-width="2"/>
  <g fill="#4a7ab8" stroke="#1f3a5f">
    <circle cx="200" cy="85" r="7"/><circle cx="247" cy="112" r="7"/><circle cx="247" cy="168" r="7"/>
    <circle cx="200" cy="195" r="7"/><circle cx="153" cy="168" r="7"/><circle cx="153" cy="112" r="7"/>
  </g>
  <text x="200" y="145" text-anchor="middle" fill="#1f3a5f" font-weight="bold">ATC</text>
  <text x="200" y="230" text-anchor="middle" fill="#1f3a5f" font-size="12">自動工具交換装置</text>
  <text x="200" y="246" text-anchor="middle" fill="#1f3a5f" font-size="12">（マガジン）</text>
  <!-- axes -->
  <g stroke="#3a9a5b" stroke-width="2.5" fill="#3a9a5b">
    <line x1="660" y1="440" x2="760" y2="440"/><polygon points="760,435 772,440 760,445"/>
    <line x1="660" y1="440" x2="660" y2="340"/><polygon points="655,340 660,328 665,340"/>
    <line x1="660" y1="440" x2="720" y2="390"/><polygon points="713,390 728,383 721,398"/>
  </g>
  <text x="775" y="445" fill="#3a9a5b" font-weight="bold">X</text>
  <text x="652" y="322" fill="#3a9a5b" font-weight="bold">Z</text>
  <text x="732" y="382" fill="#3a9a5b" font-weight="bold">Y</text>
  <text x="700" y="480" text-anchor="middle" fill="#3a9a5f" font-size="12">右手座標系（Z＝主軸方向）</text>
  <!-- control -->
  <rect x="640" y="130" width="140" height="120" rx="6" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
  <rect x="655" y="145" width="110" height="60" fill="#1f3a5f"/>
  <text x="710" y="180" text-anchor="middle" fill="#7fd1a1" font-size="11">G54 G90 G00</text>
  <text x="710" y="235" text-anchor="middle" fill="#1f3a5f" font-weight="bold">NC 装置</text>
  <!-- coolant -->
  <rect x="120" y="290" width="80" height="45" rx="4" fill="#dbe4ee" stroke="#1f3a5f" stroke-width="2"/>
  <text x="160" y="310" text-anchor="middle" fill="#1f3a5f" font-size="12">クーラント</text>
  <text x="160" y="326" text-anchor="middle" fill="#1f3a5f" font-size="12">タンク</text>
  <text x="410" y="505" text-anchor="middle" fill="#555" font-size="12">主軸が上下（Z）、テーブルが前後左右（X・Y）に動く 3 軸構成が最も一般的</text>
</svg>
