<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">代表的な材料の被削性と超硬エンドミル切削速度の目安</text>
  <g transform="translate(200,60)">
    <!-- axis -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="340" x2="620" y2="340" stroke="#333" stroke-width="2"/>
    <text x="310" y="368" text-anchor="middle" fill="#333">切削速度 Vc の目安 [m/min]（超硬コーティング・エンドミル）</text>
    <g fill="#333" font-size="11">
      <text x="0" y="356" text-anchor="middle">0</text><text x="124" y="356" text-anchor="middle">100</text><text x="248" y="356" text-anchor="middle">200</text>
      <text x="372" y="356" text-anchor="middle">300</text><text x="496" y="356" text-anchor="middle">400</text><text x="620" y="356" text-anchor="middle">500+</text>
    </g>
    <g stroke="#ddd"><line x1="124" y1="0" x2="124" y2="340"/><line x1="248" y1="0" x2="248" y2="340"/><line x1="372" y1="0" x2="372" y2="340"/><line x1="496" y1="0" x2="496" y2="340"/></g>
    <!-- bars: (y, from, to, color) -->
    <g>
      <rect x="248" y="10" width="372" height="26" fill="#7fd1a1" stroke="#1d5a33"/><text x="-8" y="28" text-anchor="end" fill="#1d5a33" font-weight="bold">アルミ合金 A5052/A7075</text>
      <rect x="149" y="46" width="223" height="26" fill="#9fdcb5" stroke="#1d5a33"/><text x="-8" y="64" text-anchor="end" fill="#1d5a33">黄銅 C3604 / 樹脂</text>
      <rect x="149" y="82" width="149" height="26" fill="#b5d9f0" stroke="#1f3a5f"/><text x="-8" y="100" text-anchor="end" fill="#1f3a5f">快削鋼 SUM / 鋳鉄 FC250</text>
      <rect x="124" y="118" width="149" height="26" fill="#8fc0e8" stroke="#1f3a5f"/><text x="-8" y="136" text-anchor="end" fill="#1f3a5f">炭素鋼 S45C / SS400</text>
      <rect x="99" y="154" width="124" height="26" fill="#6ea6d9" stroke="#1f3a5f"/><text x="-8" y="172" text-anchor="end" fill="#1f3a5f">合金鋼 SCM440 / 調質鋼</text>
      <rect x="74" y="190" width="112" height="26" fill="#f5c26b" stroke="#7a5010"/><text x="-8" y="208" text-anchor="end" fill="#7a5010">ステンレス SUS304 / 316</text>
      <rect x="99" y="226" width="124" height="26" fill="#f5c26b" stroke="#7a5010"/><text x="-8" y="244" text-anchor="end" fill="#7a5010">SUS430 / SUS420J2</text>
      <rect x="62" y="262" width="74" height="26" fill="#f0a070" stroke="#7a3d10"/><text x="-8" y="280" text-anchor="end" fill="#7a3d10">焼入れ鋼 50〜60HRC</text>
      <rect x="37" y="298" width="62" height="26" fill="#e88080" stroke="#8a1f1f"/><text x="-8" y="316" text-anchor="end" fill="#8a1f1f">Ti合金 / インコネル</text>
    </g>
  </g>
  <g transform="translate(30,455)" font-size="12">
    <text x="0" y="0" fill="#555">値は工具メーカー推奨の一般的な範囲。工具径・刃数・剛性・クーラントで上下する。必ず工具カタログの推奨値を起点に調整する。</text>
    <text x="0" y="20" fill="#555">難削材ほど「低速・高送り・確実な切込み」が原則。擦るとすぐに加工硬化する（SUS・Ti・Ni 合金）。</text>
    <text x="0" y="40" fill="#555">高硬度鋼は CBN／高硬度用コート超硬でネガ刃先・小切込み・高回転が基本。</text>
  </g>
</svg>
