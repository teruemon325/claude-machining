<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="IPAGothic, 'Noto Sans JP', 'Hiragino Sans', Meiryo, sans-serif" font-size="13">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f3a5f">面粗さの理論値：送りマークとスカラップ（カスプ）</text>
  <g transform="translate(40,60)">
    <text x="200" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">側面・正面切削の送りマーク（ノーズ R と fz）</text>
    <rect x="0" y="180" width="400" height="60" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <!-- scallops -->
    <path d="M0 180 a 60 60 0 0 0 80 0 a 60 60 0 0 0 80 0 a 60 60 0 0 0 80 0 a 60 60 0 0 0 80 0 a 60 60 0 0 0 80 0" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <!-- feed dim -->
    <line x1="160" y1="215" x2="240" y2="215" stroke="#e8833a" stroke-width="2"/>
    <line x1="160" y1="208" x2="160" y2="222" stroke="#e8833a"/><line x1="240" y1="208" x2="240" y2="222" stroke="#e8833a"/>
    <text x="200" y="235" text-anchor="middle" fill="#e8833a" font-size="12">f（1 刃送り fz）</text>
    <!-- Rz dim -->
    <line x1="420" y1="180" x2="420" y2="195" stroke="#3a9a5b" stroke-width="2"/>
    <line x1="412" y1="180" x2="428" y2="180" stroke="#3a9a5b"/><line x1="412" y1="195" x2="428" y2="195" stroke="#3a9a5b"/>
    <text x="434" y="192" fill="#3a9a5b" font-size="12">Rz</text>
    <!-- nose radius circle -->
    <circle cx="120" cy="135" r="60" fill="none" stroke="#d64545" stroke-dasharray="4 3"/>
    <text x="120" y="66" text-anchor="middle" fill="#d64545" font-size="12">ノーズ R（コーナ R）の軌跡</text>
    <rect x="0" y="260" width="400" height="80" rx="6" fill="#f7f9fc" stroke="#4a7ab8"/>
    <text x="12" y="284" fill="#222" font-size="14">Rz（理論）≈ f² ÷ (8 × R) × 1000 [µm]</text>
    <text x="12" y="306" fill="#333" font-size="12">例）f = 0.1 mm、R = 0.4 mm → Rz ≈ 3.1 µm</text>
    <text x="12" y="326" fill="#333" font-size="12">　　f = 0.1 mm、R = 1.0 mm → Rz ≈ 1.25 µm（R を大きくすると面は良くなるがびびりやすい）</text>
  </g>
  <g transform="translate(480,60)">
    <text x="200" y="0" text-anchor="middle" font-weight="bold" fill="#1f3a5f">ボールエンドミルのスカラップ（ピックフィード）</text>
    <rect x="0" y="160" width="400" height="80" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
    <g fill="#fff" stroke="#4a7ab8" stroke-dasharray="4 3">
      <circle cx="80" cy="130" r="50"/><circle cx="160" cy="130" r="50"/><circle cx="240" cy="130" r="50"/><circle cx="320" cy="130" r="50"/>
    </g>
    <rect x="0" y="80" width="400" height="100" fill="#eef3f8" stroke="none" opacity="0"/>
    <!-- cusps highlight -->
    <path d="M30 180 L120 180 M120 180 A50 50 0 0 1 120 180" fill="none"/>
    <line x1="80" y1="60" x2="160" y2="60" stroke="#e8833a" stroke-width="2"/>
    <line x1="80" y1="53" x2="80" y2="67" stroke="#e8833a"/><line x1="160" y1="53" x2="160" y2="67" stroke="#e8833a"/>
    <text x="120" y="50" text-anchor="middle" fill="#e8833a" font-size="12">ピックフィード ae</text>
    <line x1="120" y1="180" x2="120" y2="160" stroke="#3a9a5b" stroke-width="3"/>
    <text x="120" y="215" text-anchor="middle" fill="#3a9a5b" font-size="12">↑ h：カスプ高さ（削り残し）</text>
    <rect x="0" y="260" width="400" height="80" rx="6" fill="#f7f9fc" stroke="#4a7ab8"/>
    <text x="12" y="284" fill="#222" font-size="14">h ≈ ae² ÷ (4 × D) × 1000 [µm]（D：ボール径）</text>
    <text x="12" y="306" fill="#333" font-size="12">例）D = 10、ae = 0.3 → h ≈ 2.3 µm　／　ae = 0.5 → h ≈ 6.3 µm</text>
    <text x="12" y="326" fill="#333" font-size="12">傾斜面は実効径が小さく h が増える → 面に沿って ae を取る</text>
  </g>
  <text x="450" y="425" text-anchor="middle" fill="#555" font-size="12">実際の面粗さ ＝ 理論値 ＋ 振れ ＋ びびり ＋ 構成刃先 ＋ 工具摩耗。理論値の 1.5〜3 倍を見込む。</text>
  <text x="450" y="447" text-anchor="middle" fill="#555" font-size="12">Ra ≈ Rz ÷ 4 が目安（切削面の場合）。図面 Ra 1.6 は Rz 6.3 相当。</text>
  <g transform="translate(120,475)" font-size="12">
    <text x="0" y="0" fill="#1f3a5f" font-weight="bold">仕上げ記号の目安：</text>
    <text x="130" y="0" fill="#333">▽ Ra 25（荒）　▽▽ Ra 6.3（中）　▽▽▽ Ra 1.6（仕上げ）　▽▽▽▽ Ra 0.2（精密仕上げ・研削）</text>
  </g>
</svg>
